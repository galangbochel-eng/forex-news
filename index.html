<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD News Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 4px;
            color: #fff;
        }
        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
        }
        .signal-box {
            background: #141414;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .signal-box.buy { border-color: #30c060; background: #0f1a12; }
        .signal-box.sell { border-color: #e04040; background: #1a0f0f; }
        .signal-box.neutral { border-color: #666; background: #141414; }
        .signal-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 12px;
        }
        .signal-value {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }
        .signal-value.buy { color: #30c060; }
        .signal-value.sell { color: #e04040; }
        .signal-value.neutral { color: #888; }
        .signal-confidence {
            font-size: 16px;
            color: #888;
        }
        .model-status {
            font-size: 12px;
            color: #666;
            text-align: center;
            padding: 8px;
            margin-bottom: 16px;
        }
        .model-status.loading { color: #f0a030; }
        .model-status.ready { color: #30c060; }
        .model-status.error { color: #e04040; }
        .model-status.fallback { color: #f0a030; }
        .card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 12px;
        }
        .news-list { max-height: 500px; overflow-y: auto; }
        .news-item {
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .news-item:last-child { border-bottom: none; }
        .news-title {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .news-meta {
            font-size: 11px;
            color: #555;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .sentiment-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .sentiment-badge.positive { background: #1a3a1a; color: #30c060; }
        .sentiment-badge.negative { background: #3a1a1a; color: #e04040; }
        .sentiment-badge.neutral { background: #2a2a2a; color: #888; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: #e0e0e0; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .disclaimer {
            font-size: 11px;
            color: #444;
            text-align: center;
            margin-top: 24px;
            line-height: 1.5;
        }
        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #333;
            border-top-color: #f0a030;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>XAUUSD News Analyzer</h1>
        <p class="subtitle">Analisa berita → Sinyal Buy/Sell</p>

        <div id="modelStatus" class="model-status loading">
            <span class="loading-spinner"></span>Memuat model...
        </div>

        <div id="signalBox" class="signal-box neutral">
            <div class="signal-label">Sinyal dari Berita</div>
            <div id="signalValue" class="signal-value neutral">—</div>
            <div id="signalConfidence" class="signal-confidence">Menunggu analisis...</div>
        </div>

        <div class="card">
            <div class="card-title">Berita & Sentimen</div>
            <div id="newsContainer" class="news-list">
                <div style="text-align:center;color:#666;padding:20px;">Memuat berita...</div>
            </div>
        </div>

        <button id="refreshBtn" class="btn" onclick="runAnalysis()" disabled>Refresh Analisis</button>

        <p class="disclaimer">
            Analisis sentimen otomatis. Bukan saran keuangan.
            Selalu lakukan riset sendiri sebelum trading.
        </p>
    </div>

    <script type="module">
        // ===== STATE =====
        let sentimentPipeline = null;
        let modelReady = false;
        let useFallback = false;

        // ===== KEYWORD FALLBACK =====
        const BULLISH_KEYWORDS = [
            'inflation', 'geopolitic', 'war', 'crisis', 'rate cut', 'dovish',
            'weak dollar', 'recession', 'safe haven', 'uncertainty', 'tension',
            'conflict', 'stimulus', 'qe', 'printing', 'debt ceiling',
            'gold rally', 'gold surge', 'gold rise', 'bullion'
        ];

        const BEARISH_KEYWORDS = [
            'rate hike', 'hawkish', 'strong dollar', 'yield', 'tightening',
            'recovery', 'optimism', 'peace', 'ceasefire', 'agreement',
            'gold fall', 'gold drop', 'gold decline', 'sell-off',
            'profit taking', 'correction'
        ];

        function keywordSentiment(text) {
            const lower = text.toLowerCase();
            let bull = 0, bear = 0;

            BULLISH_KEYWORDS.forEach(kw => { if (lower.includes(kw)) bull++; });
            BEARISH_KEYWORDS.forEach(kw => { if (lower.includes(kw)) bear++; });

            if (bull > bear) return { label: 'positive', score: Math.min(bull / 3, 1), numericScore: Math.min(bull / 3, 1) };
            if (bear > bull) return { label: 'negative', score: Math.min(bear / 3, 1), numericScore: -Math.min(bear / 3, 1) };
            return { label: 'neutral', score: 0.5, numericScore: 0 };
        }

        // ===== LOAD MODEL =====
        async function loadModel() {
            const statusEl = document.getElementById('modelStatus');

            try {
                statusEl.innerHTML = '<span class="loading-spinner"></span>Memuat FinBERT ONNX...';

                // Dynamic import
                const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');

                env.allowLocalModels = false;
                env.useBrowserCache = true;

                // Pakai Xenova/finbert - versi ONNX yang work
                sentimentPipeline = await pipeline(
                    'sentiment-analysis',
                    'Xenova/finbert',
                    { quantized: true }
                );

                modelReady = true;
                statusEl.textContent = '✓ FinBERT siap';
                statusEl.className = 'model-status ready';
                document.getElementById('refreshBtn').disabled = false;

                // Auto-run
                runAnalysis();

            } catch (error) {
                console.error('Model load error:', error);
                
                // Fallback ke keyword matching
                useFallback = true;
                modelReady = true;
                statusEl.textContent = '⚠ Model gagal load, pakai keyword analysis (fallback)';
                statusEl.className = 'model-status fallback';
                document.getElementById('refreshBtn').disabled = false;

                // Auto-run dengan fallback
                runAnalysis();
            }
        }

        // ===== FETCH NEWS =====
        async function fetchNews() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">Memuat berita...</div>';

            const feeds = [
                { name: 'Reuters', url: 'https://feeds.reuters.com/reuters/businessNews' },
                { name: 'FXStreet', url: 'https://www.fxstreet.com/rss/news' },
                { name: 'BBC Business', url: 'http://feeds.bbci.co.uk/news/business/rss.xml' }
            ];

            const allNews = [];

            for (const feed of feeds) {
                try {
                    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&count=10`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) continue;

                    const data = await response.json();
                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            allNews.push({
                                title: item.title,
                                description: item.description || '',
                                link: item.link,
                                pubDate: item.pubDate,
                                source: feed.name,
                                sentiment: null,
                                score: 0,
                                numericScore: 0
                            });
                        });
                    }
                } catch (e) {
                    console.warn(`Failed ${feed.name}:`, e);
                }
            }

            if (allNews.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#e04040;padding:20px;">Gagal load berita. Cek koneksi.</div>';
                return;
            }

            // Filter relevan
            const relevantKeywords = ['gold', 'xau', 'fed', 'dollar', 'inflation', 'rate',
                                       'yield', 'economy', 'market', 'trade', 'geopolitic',
                                       'war', 'crisis', 'recession', 'metal', 'commodity'];

            const relevantNews = allNews.filter(item => {
                const text = (item.title + ' ' + item.description).toLowerCase();
                return relevantKeywords.some(kw => text.includes(kw));
            });

            const newsToAnalyze = relevantNews.length > 0 ? relevantNews : allNews;

            // Analisis sentimen
            await analyzeSentiment(newsToAnalyze);

            // Render
            renderNews(newsToAnalyze);

            // Generate signal
            generateSignal(newsToAnalyze);
        }

        // ===== ANALYZE SENTIMENT =====
        async function analyzeSentiment(newsItems) {
            for (const item of newsItems) {
                const text = (item.title + '. ' + item.description).substring(0, 500);

                if (useFallback || !sentimentPipeline) {
                    // Pakai keyword matching
                    const result = keywordSentiment(text);
                    item.sentiment = result.label;
                    item.score = result.score;
                    item.numericScore = result.numericScore;
                } else {
                    try {
                        const result = await sentimentPipeline(text);
                        const sentiment = result[0];

                        item.sentiment = sentiment.label;
                        item.score = sentiment.score;

                        if (sentiment.label === 'positive') {
                            item.numericScore = sentiment.score;
                        } else if (sentiment.label === 'negative') {
                            item.numericScore = -sentiment.score;
                        } else {
                            item.numericScore = 0;
                        }
                    } catch (e) {
                        // Fallback per item
                        const result = keywordSentiment(text);
                        item.sentiment = result.label;
                        item.score = result.score;
                        item.numericScore = result.numericScore;
                    }
                }
            }
        }

        // ===== RENDER NEWS =====
        function renderNews(newsItems) {
            const container = document.getElementById('newsContainer');

            container.innerHTML = newsItems.slice(0, 20).map(item => {
                const sentiment = item.sentiment || 'neutral';
                const score = item.numericScore || 0;
                const scorePercent = Math.abs(score) * 100;

                return `
                    <div class="news-item">
                        <div class="news-title">${item.title}</div>
                        <div class="news-meta">
                            <span class="sentiment-badge ${sentiment}">${sentiment}</span>
                            <span>${(score * 100).toFixed(0)}%</span>
                            <span>· ${item.source}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== GENERATE SIGNAL =====
        function generateSignal(newsItems) {
            const signalBox = document.getElementById('signalBox');
            const signalValue = document.getElementById('signalValue');
            const signalConfidence = document.getElementById('signalConfidence');

            const validItems = newsItems.filter(item => item.numericScore !== undefined);
            if (validItems.length === 0) {
                signalValue.textContent = '—';
                signalConfidence.textContent = 'Tidak ada data';
                return;
            }

            const avgScore = validItems.reduce((sum, item) => sum + item.numericScore, 0) / validItems.length;

            const positiveCount = validItems.filter(i => i.numericScore > 0.1).length;
            const negativeCount = validItems.filter(i => i.numericScore < -0.1).length;
            const total = validItems.length;

            const consistency = Math.abs(positiveCount - negativeCount) / total;

            let signal, confidence;

            if (avgScore > 0.15) {
                signal = 'BUY';
                confidence = Math.min(Math.round(avgScore * 100 + consistency * 30), 95);
            } else if (avgScore < -0.15) {
                signal = 'SELL';
                confidence = Math.min(Math.round(Math.abs(avgScore) * 100 + consistency * 30), 95);
            } else {
                signal = 'NEUTRAL';
                confidence = Math.round((1 - Math.abs(avgScore)) * 100);
            }

            signalBox.className = `signal-box ${signal.toLowerCase()}`;
            signalValue.textContent = signal;
            signalValue.className = `signal-value ${signal.toLowerCase()}`;
            signalConfidence.textContent = `Confidence: ${confidence}% · ${validItems.length} berita${useFallback ? ' (keyword mode)' : ''}`;
        }

        // ===== RUN ANALYSIS =====
        async function runAnalysis() {
            if (!modelReady) return;
            await fetchNews();
        }

        // ===== INIT =====
        window.runAnalysis = runAnalysis;
        document.addEventListener('DOMContentLoaded', loadModel);
    </script>
</body>
</html>
